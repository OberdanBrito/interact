services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interact
      POSTGRES_PASSWORD: interact
      POSTGRES_DB: interact
    ports:
      - "5432:5432"
    volumes:
      - interact-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interact"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  interact-db:
