services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: interact
      MONGO_INITDB_ROOT_PASSWORD: interact
    ports:
      - "27017:27017"
    volumes:
      - interact-db:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\""]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  interact-db:
